{% set _logo_pos = logo_position | default('left') %}
{% set _show_actions = show_actions if show_actions is defined else true %}
<header class="app-head legal-head{% if _logo_pos == 'center' %} app-head-center center{% endif %}" data-logo-position="{{ _logo_pos }}" aria-label="шапка сайта">
  <a class="brand" href="/" data-nav="home"><span class="brand-name">WIR<span>ING</span></span><span class="beta-label">beta</span></a>
  {% if _show_actions %}
  <div class="app-head-end">
    <div class="theme-swatches" role="group" aria-label="цвет">
      <button type="button" class="swatch" data-theme-set="pastel" aria-label="пастель" title="пастель"></button>
      <button type="button" class="swatch" data-theme-set="mist" aria-label="дымка" title="дымка"></button>
      <button type="button" class="swatch" data-theme-set="night" aria-label="ночь" title="ночь"></button>
      <button type="button" class="swatch" data-theme-set="dusk" aria-label="сумерки" title="сумерки"></button>
      <button type="button" class="swatch" data-theme-set="slate" aria-label="грифель" title="грифель"></button>
    </div>
    {% if header_extra %}
      {{ header_extra | safe }}
    {% endif %}
  </div>
  {% endif %}
</header>
