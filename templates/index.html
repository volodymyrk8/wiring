<!DOCTYPE html>
<html lang="{{ language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ _(page_title) }}</title>
  <meta name="description" content="{{ _(meta_description) }}">
  <link rel="canonical" href="{{ site_url }}/">
  <meta name="theme-color" content="#e9ebf3">
  <script>
    (function () {
      var t = "";
      try { t = localStorage.getItem("wiring-theme") || ""; } catch (e) {}
      if (!t && document.cookie) {
        var m = document.cookie.match(/(?:^|;\s*)wiring-theme=([^;]+)/);
        if (m) t = decodeURIComponent(m[1]);
      }
      var ok = { pastel: "#f3eee6", mist: "#e9ebf3", dusk: "#1a1c24", night: "#110e0c", slate: "#0b0f14" };
      var theme = ok[t] ? t : "mist";
      document.documentElement.dataset.theme = theme;
      var color = ok[theme];
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) { meta.setAttribute("content", color); meta.content = color; }
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WIRING">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="{{ 'en_US' if language == 'en' else 'ru_RU' }}">
  <meta property="og:site_name" content="WIRING">
  <meta property="og:title" content="{{ _(page_title) }}">
  <meta property="og:description" content="{{ _(og_description) }}">
  <meta property="og:url" content="{{ site_url }}/">
  <meta property="og:image" content="{{ site_url }}/public/og.svg?v=2">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="{{ base_path }}/public/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ base_path }}/public/icon-180.png">
  <link rel="manifest" href="{{ base_path }}/public/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ base_path }}/public/styles.css?v=147">
  {% if google_analytics_id or yandex_metrika_id %}
  <script>
    window.WIRING_ANALYTICS_ID = {{ google_analytics_id | tojson }};
    window.WIRING_METRIKA_ID = {{ yandex_metrika_id | tojson }};
  </script>
  <script src="{{ base_path }}/public/analytics.js?v=5" defer></script>
  {% endif %}
</head>
<body>
  <div id="app" data-base="{{ base_path }}" data-registration-created="{{ 'true' if registration_created else 'false' }}"></div>
  <script type="module" src="{{ base_path }}/public/dist/app.js?v=93"></script>
</body>
</html>
