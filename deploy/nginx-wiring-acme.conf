# Temporary HTTP vhost for first-time Let's Encrypt issuance. The deploy script
# enables this only while the new domain's certificate does not exist.
server {
    listen 80;
    listen [::]:80;
    server_name wiring.club www.wiring.club;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}
