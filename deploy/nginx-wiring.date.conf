server {
    listen 80;
    listen [::]:80;
    server_name wiring.date www.wiring.date;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://wiring.date$request_uri;
    }
}

server {
    listen 161.35.244.18:443 ssl http2;
    listen 188.166.105.108:443 ssl;
    server_name www.wiring.date;

    ssl_certificate /etc/letsencrypt/live/wiring.date/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wiring.date/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://wiring.date$request_uri;
}

server {
    listen 161.35.244.18:443 ssl http2;
    listen 188.166.105.108:443 ssl;
    server_name wiring.date;

    ssl_certificate /etc/letsencrypt/live/wiring.date/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wiring.date/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:5070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
